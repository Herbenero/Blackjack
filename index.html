<!-- Inside <aside class="panel setup reveal"> -->
<div class="player-inputs" id="playerInputs"></div>

<!-- Add this new randomize option -->
<div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
  <input type="checkbox" id="randomizePlayersCheckbox" style="width: 20px; height: 20px; accent-var: var(--gold); cursor: pointer;" />
  <label for="randomizePlayersCheckbox" style="font-size: 0.9rem; font-weight: 600; cursor: pointer;">Randomize player order on start</label>
</div>

<div class="setup-actions">
  <button class="btn btn-secondary" id="addPlayerBtn" type="button">Add Player</button>
  <button class="btn btn-primary" id="startGameBtn" type="button">Start Game</button>
  <button class="btn btn-danger" id="resetBtn" type="button">Reset</button>
</div>
