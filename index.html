<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack Darts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0b08;
      --bg2: #17130d;
      --panel: #1b1711cc;
      --panel-solid: #201b14;
      --ink: #f6eed8;
      --muted: #baa98a;
      --gold: #f2c14e;
      --gold2: #d89b24;
      --red: #dd4e3d;
      --green: #6fcb93;
      --line: rgba(242, 193, 78, .16);
      --shadow: 0 20px 60px rgba(0, 0, 0, .42);
      --radius: 24px;
      --radius-sm: 16px;
      --max: 1320px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 15% 10%, rgba(242, 193, 78, .12), transparent 22%),
                  radial-gradient(circle at 85% 10%, rgba(221, 78, 61, .10), transparent 20%),
                  radial-gradient(circle at 50% 100%, rgba(216, 155, 36, .12), transparent 30%),
                  linear-gradient(180deg, #0a0907 0%, #110f0b 48%, #0a0907 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .shell { width: min(var(--max), calc(100% - 1.2rem)); margin-inline: auto; padding-bottom: 2rem; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; padding: 1rem 0 .6rem; position: sticky; top: 0; z-index: 30;
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(10, 9, 7, .88), rgba(10, 9, 7, .42), transparent);
    }
    .brand { display: flex; align-items: center; gap: .85rem; }
    .brand h1 { margin: 0; font-family: 'Bebas Neue', cursive; letter-spacing: .06em; font-size: clamp(2rem, 3vw, 3.5rem); line-height: .9; color: var(--gold); }
    .brand p { margin: 0; color: var(--muted); font-size: .9rem; text-transform: uppercase; letter-spacing: .12em; }
    .panel { background: linear-gradient(180deg, rgba(31, 27, 20, .9), rgba(18, 16, 12, .88)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); padding: 1.5rem; margin-top: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .btn { background: var(--gold); color: #000; border: none; font-weight: 800; padding: .8rem 1.2rem; border-radius: var(--radius-sm); cursor: pointer; text-transform: uppercase; font-size: 1rem; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-stand { background: var(--green); color: #000; }
    .score-badge { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
    .player-card { border: 1px solid var(--line); padding: 1rem; border-radius: var(--radius-sm); background: rgba(255,255,255,0.02); }
    .player-card.active { border-color: var(--gold); background: rgba(242, 193, 78, 0.05); }
    .logs { background: #000; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 1rem; font-family: monospace; font-size: .85rem; color: var(--gold); max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div>
          <h1>Blackjack Darts</h1>
          <p>Beat The House</p>
        </div>
      </div>
    </div>

    <!-- Game Setup -->
    <div id="setup-panel" class="panel">
      <h2>Game Setup</h2>
      <p>Enter player names (comma separated):</p>
      <input type="text" id="player-names-input" value="Player 1, Player 2" style="width: 100%; padding: .8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); margin-bottom: 1rem;">
      <button class="btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Active Game Panel -->
    <div id="game-panel" class="panel" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Round <span id="round-num">1</span></h2>
        <button class="btn btn-danger" onclick="resetGame()">Reset Game</button>
      </div>

      <!-- House / Dealer Board -->
      <div class="player-card" style="margin-bottom: 1.5rem; border-color: var(--red);">
        <h3>House (Dealer)</h3>
        <div>Score: <span id="house-score" class="score-badge">0</span> <span id="house-status"></span></div>
      </div>

      <!-- Active Turn Area -->
      <div id="turn-area" class="panel" style="margin-bottom: 1.5rem; background: var(--panel-solid);">
        <h3>Current Turn: <span id="current-player-name" style="color: var(--gold);"></span></h3>
        <p>Current Hand Value: <span id="current-player-score" class="score-badge">0</span></p>
        <div style="display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem;">
          <button class="btn" onclick="addPoints(1)">+1</button>
          <button class="btn" onclick="addPoints(5)">+5</button>
          <button class="btn" onclick="addPoints(10)">+10</button>
          <button class="btn btn-stand" onclick="standCurrentPlayer()">Stand</button>
        </div>
      </div>

      <!-- Scoreboard Grid -->
      <h3>Scoreboard</h3>
      <div id="players-grid" class="grid"></div>

      <!-- Game Logs -->
      <h3 style="margin-top: 1.5rem;">Console & Game Logs</h3>
      <div id="logs" class="logs"></div>
    </div>
  </div>

  <script>
    let gameState = {
      round: 1,
      currentPlayerIndex: 0,
      house: { score: 0, busted: false },
      players: []
    };

    function logMessage(msg) {
      console.log(msg);
      const logsEl = document.getElementById('logs');
      if (logsEl) {
        logsEl.innerHTML += `<div>${msg}</div>`;
        logsEl.scrollTop = logsEl.scrollHeight;
      }
    }

    function startGame() {
      const input = document.getElementById('player-names-input').value;
      const names = input.split(',').map(n => n.trim()).filter(n => n.length > 0);
      
      if (names.length === 0) return;

      gameState.players = names.map(name => ({
        name: name,
        score: 0,
        totalPoints: 0,
        busted: false,
        standing: false
      }));

      gameState.round = 1;
      document.getElementById('setup-panel').style.display = 'none';
      document.getElementById('game-panel').style.display = 'block';

      startRound();
    }

    function startRound() {
      // Generate House Score between 17 and 24 (simulating dealer/house draw)
      const houseScoreVal = Math.floor(Math.random() * 8) + 17;
      gameState.house = {
        score: houseScoreVal,
        busted: houseScoreVal > 21
      };

      document.getElementById('house-score').innerText = gameState.house.score;
      document.getElementById('house-status').innerText = gameState.house.busted ? '(BUSTED)' : '';

      gameState.currentPlayerIndex = 0;
      gameState.players.forEach(p => {
        p.score = 0;
        p.busted = false;
        p.standing = false;
      });

      logMessage(`--- Starting Round ${gameState.round} ---`);
      logMessage(`House Target/Score: ${gameState.house.score} ${gameState.house.busted ? '(Bust)' : ''}`);

      updateUI();
    }

    function addPoints(pts) {
      let player = gameState.players[gameState.currentPlayerIndex];
      if (player.busted || player.standing) return;

      player.score += pts;
      if (player.score > 21) {
        player.busted = true;
        logMessage(`${player.name} added ${pts} pts -> Score: ${player.score} (BUSTED)`);
        nextTurn();
      } else {
        logMessage(`${player.name} added ${pts} pts -> Current Score: ${player.score}`);
        updateUI();
      }
    }

    function standCurrentPlayer() {
      let player = gameState.players[gameState.currentPlayerIndex];
      if (player.busted || player.standing) return;

      player.standing = true;
      logMessage(`${player.name} chose to STAND at ${player.score}`);
      nextTurn();
    }

    function nextTurn() {
      gameState.currentPlayerIndex++;
      if (gameState.currentPlayerIndex >= gameState.players.length) {
        evaluateRound();
      } else {
        updateUI();
      }
    }

    function evaluateRound() {
      const houseScore = gameState.house.score;
      const houseBust = gameState.house.busted;

      logMessage(`\n=== Round ${gameState.round} Results ===`);

      gameState.players.forEach(player => {
        let ptsAwarded = 0;

        if (!player.busted) {
          if (houseBust || player.score > houseScore) {
            ptsAwarded = 3; // Beat the house
          } else if (player.score === houseScore) {
            ptsAwarded = 1; // Tied the house
          }
        }

        player.totalPoints += ptsAwarded;

        // Log result details for each player
        const logText = `Player: ${player.name.padEnd(12)} | Hand Score: ${String(player.score).padStart(2)} | Busted: ${String(player.busted).padEnd(5)} | House: ${houseScore} | Points Awarded: +${ptsAwarded} | Total Match Points: ${player.totalPoints}`;
        logMessage(logText);
      });

      gameState.round++;
      setTimeout(() => {
        alert("Round complete! Check logs for detailed scores.");
        startRound();
      }, 500);
    }

    function updateUI() {
      document.getElementById('round-num').innerText = gameState.round;

      let currentPlayer = gameState.players[gameState.currentPlayerIndex];
      if (currentPlayer) {
        document.getElementById('current-player-name').innerText = currentPlayer.name;
        document.getElementById('current-player-score').innerText = currentPlayer.score;
      }

      const grid = document.getElementById('players-grid');
      grid.innerHTML = '';

      gameState.players.forEach((p, idx) => {
        const isActive = idx === gameState.currentPlayerIndex;
        let status = 'Playing';
        if (p.busted) status = 'Busted';
        else if (p.standing) status = 'Stood';

        grid.innerHTML += `
          <div class="player-card ${isActive ? 'active' : ''}">
            <h4>${p.name} ${isActive ? '⚡' : ''}</h4>
            <p>Hand Score: <strong>${p.score}</strong> (${status})</p>
            <p>Total Game Points: <strong>${p.totalPoints}</strong></p>
          </div>
        `;
      });
    }

    function resetGame() {
      document.getElementById('setup-panel').style.display = 'block';
      document.getElementById('game-panel').style.display = 'none';
      document.getElementById('logs').innerHTML = '';
    }
  </script>
</body>
</html>
